name: Plugin Build

# Every push and pull request is built and tested. A release is cut only by
# running this workflow by hand: it tags the release with the version in
# lossless_sources/build.gradle.kts, which is also what installed copies
# compare against when they check for updates.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: 'Publish a GitHub release with the built plugin'
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fake hosts for every source: routing, failover, retries, the source list
      # cache and the update check.
      - name: Run tests
        run: ./gradlew :lossless_sources:jvmTest --stacktrace

      - name: Package plugin
        run: ./gradlew :lossless_sources:packageProductionPlugin --stacktrace

      # Not plugin.smplug: Spotube 5 plugins (1.x) update only to an asset with
      # exactly that name, and must not be offered a build they cannot load.
      # Spotube 6 takes any *.smplug asset.
      - name: Name the package
        run: cp lossless_sources/build/distributions/plugin-production.smplug lossless-sources.smplug

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import json, sys, zipfile
          archive = zipfile.ZipFile("lossless-sources.smplug")
          names = archive.namelist()
          print("package contents:", names)
          missing = [f for f in ("plugin.json", "logo.png") if f not in names]
          if not any(n.endswith(".zipline") for n in names):
              missing.append("*.zipline")
          if missing:
              sys.exit(f"MISSING FROM PACKAGE: {missing}")
          meta = json.loads(archive.read("plugin.json"))
          print(json.dumps(meta, indent=2))
          PY

      - name: Read plugin version
        id: meta
        run: |
          version=$(awk '/spotubePlugin[[:space:]]*\{/ { inside = 1 }
                         inside && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' lossless_sources/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::No version in the spotubePlugin {} block"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: lossless-sources-${{ steps.meta.outputs.version }}
          path: lossless-sources.smplug
          if-no-files-found: error

      - name: Publish release ${{ steps.meta.outputs.version }}
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          commit: ${{ github.sha }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: lossless-sources.smplug
